[lint]

preview = true

select = [
    "T",
    "Q",
    "W",
    "B",
    "N",
    "F",
    "FA",
    "RET",
    "PTH",
    "ERA",
    "PLW",
    "PERF",
    "RUF",
    "FLY",
    "PT",
    "PYI",
    "PIE",
    "ICN",
    "UP",
    "TRY",
    "C4",
    "multiple-imports-on-one-line",
    "not-in-test",
    "type-comparison",
    "assert",
    "request-without-timeout",
    "needless-bool",
    "if-with-same-arms",
    "in-dict-keys",
    "if-expr-with-true-false",
    "collapsible-else-if",
    "useless-return",
]

ignore = [
    "unnecessary-lambda",
]

exclude = [
    "tests.py",
    "scripts/*"
]
